version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch/minor churn; majors stay separate so they
      # get read properly.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The base image tag has to move together with .nvmrc and the root
      # package.json `engines` field, which Dependabot can't see. Bump Node
      # deliberately, in all three places, not by merging a bot PR.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
