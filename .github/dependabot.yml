version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch/minor churn; majors stay separate so they
      # get read properly.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        # A 0.x minor is allowed to break, and node-ical's does. Keeping it out
        # of the group means one breaking dependency can't block the safe ones.
        exclude-patterns: ["node-ical"]
    ignore:
      # Both of these were merged once and had to be reverted. Patches and
      # minors still come through, so security fixes are not blocked.
      #
      # zod 4 removes `_def.typeName`, which the auto-generated widget settings
      # form introspects, and @hookform/resolvers v3's zodResolver throws on a
      # v4 schema. Migrating means resolvers v5+, rewriting buildFields against
      # `_zod.def.type`, and re-checking every widget's settings form.
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      # better-sqlite3 13 ships no prebuilt binary, so it falls back to
      # node-gyp and the production image has no compiler. Taking it means
      # adding python3/make/g++ to the Docker stages.
      - dependency-name: better-sqlite3
        update-types: ["version-update:semver-major"]
      # Next 16 enables Turbopack by default and rejects the `webpack` config
      # that externalizes better-sqlite3 / node-ical / fast-xml-parser. Moving
      # to it means proving Turbopack keeps those out of the server bundle —
      # a silently bundled native module fails at runtime, not at build time.
      # 15.x patches and minors still come through, which is what the security
      # advisories need.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      # node-ical 0.27 moved its date handling to Temporal, changing the event
      # types google-calendar.ts reads (`Date` -> `{}`). Probably the right
      # direction — CLAUDE.md already lists calendar timezone handling as due
      # for rework — but it needs verifying against real feeds, recurrence and
      # DST. Patches still come through.
      - dependency-name: node-ical
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The base image tag has to move together with .nvmrc and the root
      # package.json `engines` field, which Dependabot can't see. Bump Node
      # deliberately, in all three places, not by merging a bot PR.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
