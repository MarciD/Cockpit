version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Split on whether semver actually promises anything, because that is what
      # decides whether a bump is allowed to merge itself. Majors are never
      # grouped, so they always arrive as their own PR.
      #
      # At 1.0 and above a minor is additive by contract, so the routine churn
      # rides in one PR that merges itself once CI is green — see
      # .github/workflows/dependabot-automerge.yml, which gates on this group's
      # name.
      stable:
        patterns: ["*"]
        # Kept in step with `pre-1-0` below by hand. Dependabot's config parser
        # is not documented to support YAML anchors, and an exclude list that
        # silently failed to parse would auto-merge precisely the bumps this
        # split exists to hold back.
        exclude-patterns:
          - "@anthropic-ai/sdk"
          - "drizzle-kit"
          - "drizzle-orm"
          - "node-ical"
        update-types: ["minor", "patch"]
      # Below 1.0 semver permits a minor to break, and here one did: drizzle-orm
      # 0.38 -> 0.45. These land as their own PR and stay manual, so a breaking
      # dependency can neither block the safe ones nor merge itself on a green
      # type-check.
      pre-1-0:
        patterns:
          - "@anthropic-ai/sdk"
          - "drizzle-kit"
          - "drizzle-orm"
          - "node-ical"
        update-types: ["minor", "patch"]
    ignore:
      # Both of these were merged once and had to be reverted. Patches and
      # minors still come through, so security fixes are not blocked.
      #
      # zod 4 removes `_def.typeName`, which the auto-generated widget settings
      # form introspects, and @hookform/resolvers v3's zodResolver throws on a
      # v4 schema. Migrating means resolvers v5+, rewriting buildFields against
      # `_zod.def.type`, and re-checking every widget's settings form.
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      # better-sqlite3 13 ships no prebuilt binary, so it falls back to
      # node-gyp and the production image has no compiler. Taking it means
      # adding python3/make/g++ to the Docker stages.
      - dependency-name: better-sqlite3
        update-types: ["version-update:semver-major"]
      # Next 16 enables Turbopack by default and rejects the `webpack` config
      # that externalizes better-sqlite3 / node-ical / fast-xml-parser. Moving
      # to it means proving Turbopack keeps those out of the server bundle —
      # a silently bundled native module fails at runtime, not at build time.
      # 15.x patches and minors still come through, which is what the security
      # advisories need.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      # node-ical 0.27 moved its date handling to Temporal, changing the event
      # types google-calendar.ts reads (`Date` -> `{}`). Probably the right
      # direction — CLAUDE.md already lists calendar timezone handling as due
      # for rework — but it needs verifying against real feeds, recurrence and
      # DST. Patches still come through, in the `pre-1-0` group.
      - dependency-name: node-ical
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      # TypeScript 7 (the native rewrite) stops auto-discovering @types/node in
      # this pnpm layout. Fixing it means a per-package `types` array — the
      # shared base can't carry it, since the widget packages are browser-only —
      # and then re-teaching apps/web about Next's ambient CSS declarations,
      # which setting `types` disables. A real migration, and TypeScript is a
      # devDependency: no runtime or security exposure from staying on 5.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node must track the Node major actually run — 22, per .nvmrc,
      # the root `engines` field, and the Dockerfile base image. Bumping the
      # types ahead of the runtime describes APIs that aren't there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The base image tag has to move together with .nvmrc and the root
      # package.json `engines` field, which Dependabot can't see. Bump Node
      # deliberately, in all three places, not by merging a bot PR.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
