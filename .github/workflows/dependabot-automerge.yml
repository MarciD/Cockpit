# Auto-merge Dependabot's `stable` group once CI is green. Nothing else.
#
# Why the group and not an update type: fetch-metadata reports the *highest*
# bump in a grouped PR, so one 0.x minor riding along makes the whole PR read as
# `semver-minor`. A patch-only gate therefore never fires on a grouped config —
# it silently skipped every PR it ever saw. The safety lives in
# .github/dependabot.yml instead: `stable` is minors and patches of
# dependencies at 1.0 or above, where semver promises the change is additive.
# Both the npm and github-actions ecosystems define a group of that name, so
# this one gate covers both.
# The `pre-1-0` group and every major stay manual, because this repo has no test
# suite — a green CI run says the app compiles and boots, not that it still
# behaves. zod 4 passed every check and turned every widget settings field into
# a plain text input.
#
# Why this approves rather than bypasses. `main` requires one approving review.
# Nothing here is exempt from that: Dependabot's own bypass can't be used (its
# merge comment commands were removed in January 2026, so there is no way left
# to ask it to merge), and GitHub refuses to make the Actions app a bypass actor
# on a user-owned repo at all — "must be part of the ruleset source or owner
# organization". So the workflow supplies a real approval and the merge then
# satisfies every rule legitimately. Nothing is waived, which is the point: the
# required status checks in the *other* ruleset still gate the merge
# server-side, not merely because this job happens to wait for them.
#
# Why it waits and merges rather than `gh pr merge --auto`: enabling auto-merge
# now refuses with a 422 when the PR's requirements are not already met, which
# is precisely the moment this runs. Blocking on the checks is deterministic and
# fails loudly. `--required` is load-bearing — this workflow is itself a check on
# the PR, so without it the job would wait on itself forever. Never `--admin`:
# that would bypass the status checks, the one thing that must never be skipped.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The docker job is the long pole at ~4 minutes. This is a ceiling for a
    # wedged check, not an expected duration.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # One place decides and says why, so a skipped PR explains itself in the
      # log. The update-type check is redundant with the group's own
      # `update-types` — it is here so widening the group in dependabot.yml
      # can't quietly let a major merge itself.
      - name: Decide
        id: decide
        env:
          GROUP: ${{ steps.meta.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-minor | version-update:semver-patch) additive=yes ;;
            *) additive=no ;;
          esac
          if [ "$GROUP" = "stable" ] && [ "$additive" = yes ]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
            echo "$NAMES — stable group, $UPDATE_TYPE: merging once CI is green."
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
            echo "$NAMES — group '${GROUP:-none}', $UPDATE_TYPE: leaving it for review."
          fi

      - name: Wait for the required checks
        if: steps.decide.outputs.merge == 'true'
        run: gh pr checks "$PR_URL" --watch --required --fail-fast --interval 30
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deliberately after the wait: an approval must never sit on a PR whose
      # checks went red. Requires "Allow GitHub Actions to create and approve
      # pull requests" — if that gets turned off this step fails and nothing
      # merges, which is the safe direction. A later Dependabot rebase dismisses
      # the approval and re-triggers the workflow on `synchronize`, which runs
      # through again.
      - name: Approve
        if: steps.decide.outputs.merge == 'true'
        run: gh pr review "$PR_URL" --approve --body "Stable group, CI-gated. See .github/workflows/dependabot-automerge.yml."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge
        if: steps.decide.outputs.merge == 'true'
        run: gh pr merge "$PR_URL" --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
