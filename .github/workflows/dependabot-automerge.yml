# Auto-merge Dependabot's patch updates once CI is green. Nothing else.
#
# Why only patches: this repo has no test suite, so a green CI run says the app
# compiles and boots, not that it still behaves. A zod 4 bump passed every check
# and silently turned every widget settings field into a plain text input. And
# several dependencies are 0.x, where semver allows a *minor* to break — the
# drizzle-orm 0.38 -> 0.45 bump was exactly that. Minors and majors stay manual.
#
# Dependabot does the merging (via the comment below), not this workflow: the
# default branch requires a code-owner approval, which no bot can give, and
# `dependabot[bot]` is the bypass actor on that rule. It still waits for the
# required status checks, which nothing bypasses.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ask Dependabot to merge patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr comment "$PR_URL" --body "@dependabot squash and merge"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain why anything larger is left alone
        if: steps.meta.outputs.update-type != 'version-update:semver-patch'
        run: |
          echo "${{ steps.meta.outputs.dependency-names }} is a ${{ steps.meta.outputs.update-type }} update — leaving it for review."
